# tmux config for aiterm. Used only by aiterm's own tmux server (socket "aiterm"),
# so the user's ~/.tmux.conf is left alone.

# Mouse: click to focus a pane, drag the border to resize, wheel to scroll.
# Hold Shift for the terminal's native text selection.
set -g mouse on

# Long history, so the agent has enough to read
set -g history-limit 10000

# Proper colours, no delay after Esc
set -g default-terminal "tmux-256color"
set -sg escape-time 10

# Alt+Enter toggles between the two panes
bind -n M-Enter select-pane -t :.+

# No status bar
set -g status off

# Pane border in the same grey (brightblack) as agy's own lines
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=brightblack"
set -g pane-border-lines single
# The active pane is marked with an arrow on the border
set -g pane-border-indicators arrows

# Ctrl+Z is ignored in the agy pane: agy runs without a shell there, so a
# suspended agy could never be resumed. Other panes keep the usual Ctrl+Z
bind -n C-z if -F '#{!=:#{pane_current_command},agy}' 'send-keys C-z'

# Mouse selection is copied to the Wayland clipboard (needs wl-clipboard)
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"
