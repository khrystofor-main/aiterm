name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    # VTE with terminal properties (0.80+) and libadwaita 1.8 come with
    # Ubuntu 26.04; the hosted runners are older, so the job runs in its image
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
      # bubblewrap needs user namespaces for the eval scenarios' sandbox
      options: --privileged
    steps:
      - name: Install git
        # so the checkout is a real clone
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@v4
      - name: Run the tests (GTK under a virtual X display)
        # The dependencies and the run itself are in the script, so the
        # feedback workflow's agent can run the same thing in docker
        # (dev/ci-tests)
        run: tests/ci.sh

  package:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: Install dependencies
        run: apt-get update && apt-get install -y --no-install-recommends git python3 dpkg-dev ca-certificates
      - uses: actions/checkout@v4
      - name: Build the .deb
        run: |
          git config --global --add safe.directory "$PWD"
          packaging/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: aiterm-deb
          path: dist/*.deb
