name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    # VTE with terminal properties (0.80+) and libadwaita 1.8 come with
    # Ubuntu 26.04; the hosted runners are older, so the job runs in its image
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
      # bubblewrap needs user namespaces for the eval scenarios' sandbox
      options: --privileged
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-vte-3.91 jq bubblewrap git ca-certificates \
            xvfb xauth dbus-x11 dbus libgl1-mesa-dri fonts-dejavu-core
      - uses: actions/checkout@v4
      - name: Run the tests (GTK under a virtual X display)
        # Xvfb has no GPU: GTK's GL renderer falls back to slow software GL,
        # and a busy screen (the chat's spinners) then starves the main loop.
        # The cairo renderer is the quick one without a GPU
        env:
          GSK_RENDERER: cairo
        run: |
          useradd -m tester
          chown -R tester .
          su tester -w GSK_RENDERER -c 'dbus-run-session -- xvfb-run -a -s "-screen 0 1600x1000x24" tests/run.sh'

  package:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: Install dependencies
        run: apt-get update && apt-get install -y --no-install-recommends git python3 dpkg-dev ca-certificates
      - uses: actions/checkout@v4
      - name: Build the .deb
        run: |
          git config --global --add safe.directory "$PWD"
          packaging/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: aiterm-deb
          path: dist/*.deb
